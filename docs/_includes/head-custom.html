<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';

  mermaid.initialize({
    startOnLoad: false,
    theme: 'neutral',
    c4: { diagramMarginY: 50, c4ShapeMargin: 50, c4ShapePadding: 20 }
  });

  // kramdown/rouge renders ```mermaid as <div class="language-mermaid ..."><div><pre><code>,
  // while other renderers emit <pre><code class="language-mermaid">. Handle both.
  document.addEventListener('DOMContentLoaded', async () => {
    const blocks = document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid');
    for (const el of blocks) {
      const container = el.tagName === 'CODE' ? el.parentElement : el;
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      container.replaceWith(div);
    }
    await mermaid.run();
  });
</script>

<style>
  .mermaid { background: transparent; text-align: center; margin: 1.5em 0; }
  .mermaid svg { max-width: 100%; height: auto; }
</style>
